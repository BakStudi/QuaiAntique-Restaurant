on: push
name: 🚀 Deploy website on push
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3
      # You may pin to the exact commit or the version.
      # uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287
      - name: 📂 Install dependencies
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: 📂 Install npm dependencies
        run: npm install
              
      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          # ftp server
          server: ftp-quai-antique-restaurant.alwaysdata.net
          # ftp username
          username: quai-antique-restaurant
          # ftp password
          password: ${{ secrets.ftp_password }}
          # Server port to connect to (read your web hosts docs)
          port: # optional
          # protocol to deploy with - ftp, ftps, or ftps-legacy
          protocol: ftps # optional
          # Folder to upload from, must end with trailing slash /
          local-dir: # optional
          # Path to upload to on the server. Must end with trailing slash /
          server-dir: /www/ # optional
          # Path and name of the state file - this file is used to track which files have been deployed
          state-name: # optional
          # Prints which modifications will be made with current config options, but doesnt actually make any changes
          dry-run: # optional
          # Deletes ALL contents of server-dir, even items in excluded with exclude argument
          dangerous-clean-slate: # optional
          # An array of glob patterns, these files will not be included in the publish/delete process
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/bootstrap/scss/**
            **/node_modules/bootstrap/js/**
            **/node_modules/bootstrap-icons/icons/**
          # How verbose should the information be - minimal, standard, or verbose
          log-level: verbose # optional 
          # strict or loose
          security: # optional
          # Timeout in milliseconds for FTP operations
          timeout: # optional
